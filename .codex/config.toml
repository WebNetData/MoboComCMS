# MoboCom project agent defaults; unrelated local settings retained.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
tool_output_token_limit = 8000
web_search = "cached"

# MoboCom quality/efficiency defaults. Existing local MCP/provider/permissions
# are preserved by scripts/configure-mobocom-agents.py when installing elsewhere.

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"
interrupt_message = true
