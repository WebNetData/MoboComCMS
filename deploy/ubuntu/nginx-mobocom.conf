# Nginx reverse proxy for MoboComCMS. Replace example.com, then:
#   sudo cp deploy/ubuntu/nginx-mobocom.conf /etc/nginx/sites-available/mobocom
#   sudo ln -s /etc/nginx/sites-available/mobocom /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.com -d www.example.com
upstream mobocom_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Receipts, forum images and package uploads.
    client_max_body_size 25m;

    # Build assets are content-hashed: cache them for a year.
    location /_next/static/ {
        proxy_pass http://mobocom_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker must always be revalidated.
    location = /sw.js {
        proxy_pass http://mobocom_app;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://mobocom_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so clients cannot spoof their IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
}
