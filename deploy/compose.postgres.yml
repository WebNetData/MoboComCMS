services:
  postgres:
    image: postgres:17
    container_name: happvpn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: happvpn
      POSTGRES_DB: happvpn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - happvpn_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U happvpn -d happvpn"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  happvpn_postgres:
