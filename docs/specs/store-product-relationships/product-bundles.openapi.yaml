openapi: 3.0.3
info:
  title: MoboCom purchasable fixed product bundles
  version: 1.0.0
  description: Additive bundle read and existing cart alternative; existing product/cart/checkout URLs and ownership remain canonical.
  contact:
    name: MoboComCMS
    url: https://github.com/WebNetData/MoboComCMS
servers:
  - url: /
tags:
  - name: Store
    description: Fixed product components using current Store prices and the canonical cart.
paths:
  /api/products/{slug}/bundles:
    get:
      operationId: productBundles
      tags: [Store]
      summary: Read complete public bundles for a product
      description: Requires public source, Store enabled and default-off Admin rollout enabled. Inactive, withdrawn, deleted, invalid variant or mixed-currency definitions are omitted. Prices use canonical regular/member pricing for the current caller. Stock/member restrictions disable buying. Responses are private and never cached; no download secrets or private target fields appear. No separate bundle discount applies.
      parameters:
        - name: slug
          in: path
          required: true
          description: Existing source-product slug.
          schema: { type: string }
      responses:
        '200':
          description: At most eight complete currently public definitions; empty items are valid.
          headers:
            Cache-Control:
              description: Caller-specific membership prices must not be shared or cached.
              schema: { type: string, enum: ['private, no-store'] }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 8
                    items:
                      $ref: '#/components/schemas/Bundle'
        '404':
          description: Missing/private source, disabled Store or paused rollout.
  /api/cart:
    post:
      operationId: addProductBundleToCart
      tags: [Store]
      summary: Add a fixed bundle using the existing owner cart
      description: Scoped bundle alternative to the existing single-product POST. Every component is added atomically or the prior cart is retained. Revalidates publication, variants, stock/caps, membership, currency and cart capacity. Bundle components become normal independently editable cart lines. Cookies/session ownership and checkout repricing/stock reservation remain unchanged. Supplied productId, variantId or quantity alongside bundleId is rejected. The server owns fixed quantities and prices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundleId]
              properties:
                bundleId: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Existing cart response with current live prices; limited is always false for a complete bundle.
          content:
            application/json:
              schema:
                type: object
                required: [cart, limited]
                properties:
                  limited: { type: boolean, enum: [false] }
                  cart:
                    type: object
                    required: [token, lines, count, itemsTotal, currency]
                    properties:
                      token: { type: string }
                      count: { type: integer, minimum: 0 }
                      itemsTotal: { type: number }
                      currency: { type: string }
                      lines:
                        type: array
                        items: { type: object }
        '400':
          description: Invalid bundle identifier or ambiguous request.
        '403':
          description: Bundle requires membership the caller does not hold.
        '404':
          description: Bundle/source/target/variant unavailable or Store/rollout paused.
        '409':
          description: Full selection exceeds stock/per-order cap, mixes cart currency or exceeds cart capacity; no component is added.
components:
  schemas:
    Bundle:
      type: object
      required: [id, name, nameEn, components, currency, total, buyable, issue]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        nameEn: { type: string }
        currency: { type: string }
        total: { type: number }
        buyable: { type: boolean }
        issue: { type: string, enum: ['', MEMBERS_ONLY, QUANTITY_LIMIT] }
        components:
          type: array
          minItems: 2
          maxItems: 12
          items:
            type: object
            required: [productId, variantId, slug, name, nameEn, image, variantName, quantity, unitPrice, total]
            properties:
              productId: { type: integer, minimum: 1 }
              variantId: { type: integer, minimum: 1, nullable: true }
              slug: { type: string }
              name: { type: string }
              nameEn: { type: string }
              image: { type: string }
              variantName: { type: string }
              quantity: { type: integer, minimum: 1, maximum: 30 }
              unitPrice: { type: number }
              total: { type: number }
