      properties: { ok: { type: boolean, enum: [false] }, error: { type: string }, code: { type: string } }
    Rial: { type: string, description: Exact integer amount in IRR., pattern: '^\d{1,19}$' }
    TerminalCreate:
      type: "object"
      required: ["name"]
      properties:
        name: {"type":"string","maxLength":100}
        website: {"type":"string","format":"uri","writeOnly":true,"description":"Explicit initial HTTPS business website, required for WEBSITE/BOT only when the merchant has no registered website. Registered atomically with the first web terminal. Existing registered websites cannot be replaced here; later domain changes require administration."}
        returnUrl: {"type":"string","format":"uri","description":"Required HTTPS same registered origin for WEBSITE/BOT; omitted for PAYMENT_LINK. Social return is the validated channelUrl."}
