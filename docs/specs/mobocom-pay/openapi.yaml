openapi: 3.0.3
info:
  title: MoboComPay merchant API
  version: 1.10.0
  contact: { url: 'https://github.com/WebNetData/MoboComCMS' }
  description: >-
    An authorized administrator provisions and activates the merchant for an existing MoboCom identity.
    Public merchant enrollment is closed. The active merchant manages terminals in /pay/merchant.
    Before fulfilling an order, retrieve its payment by ID and confirm status PAID. A customer reference
    alone is not confirmation. Hosted checkout requires a browser-bound phone OTP before payment instructions,
    receipt upload or provider initiation. Existing compatible MoboCom gateways are reused. A terminal-scoped
    custom-bot adapter can send paid-order verification through the existing job queue. No production bank
    source has been live-verified by this repository. Fees snapshot a merchant-specific bearer and total cap.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - { name: Merchant, description: Merchant account and terminals. }
  - { name: Payments, description: Payment creation and verification. }
  - { name: Settlements, description: Settlement quotes and requests. }
  - { name: Bank bridge, description: Signed bank event ingestion. }
  - { name: Hosted checkout, description: Guest phone proof and payment methods on the MoboCom domain. }
  - { name: Custom bot, description: Dedicated body-token compatibility adapter and conservative paid-order delivery. }
paths:
  /api/pay/webhooks:
    get:
      operationId: getMerchantWebhooks
      tags: [Merchant]
      security: []
      description: Session-only merchant endpoint and paginated delivery history; optional page and status filters. No secret is returned.
      responses:
        '200': { description: Endpoint and delivery overview. }
        default: { description: Unauthorized or invalid filter. }
    post:
      operationId: saveMerchantWebhook
      tags: [Merchant]
      security: []
      description: Session and same-origin mutation. Create or version-claim one endpoint per terminal. The secret is shown only at creation or explicit rotation. URL must be public HTTPS without credentials, query, fragment or non-default port; DNS is checked and pinned at delivery. Changing configuration pauses old deliveries until explicit redelivery to the current binding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [terminalId, url, active]
              properties:
                terminalId: { type: string, format: uuid }
                url: { type: string, format: uri }
                active: { type: boolean }
                version: { type: integer, minimum: 0, description: Required when updating an existing endpoint. }
                rotateSecret: { type: boolean, enum: [true] }
      responses:
        '200': { description: Endpoint and one-time secret when created or rotated. }
        default: { description: 'Invalid configuration, authority or version conflict.' }
      callbacks:
        paymentPaid:
          '{$request.body#/url}':
            post:
              operationId: receiveMerchantPaidEvent
              tags: [Merchant]
              security: []
              description: Signed at-least-once event to the configured URL. Verify HMAC-SHA256 of timestamp plus dot plus raw body with the endpoint secret; enforce timestamp freshness and deduplicate the event ID before fulfillment. Return 2xx after durably accepting the event. Attempts retain the same event ID and payload.
              parameters:
                - { in: header, name: X-MoboCom-Event-Id, required: true, schema: { type: string, format: uuid } }
                - { in: header, name: X-MoboCom-Timestamp, required: true, schema: { type: string, pattern: '^[0-9]+$' } }
                - { in: header, name: X-MoboCom-Signature, required: true, schema: { type: string, pattern: '^v1=[a-f0-9]{64}$' } }
                - { in: header, name: X-MoboCom-Attempt-Id, required: true, schema: { type: string, format: uuid } }
              requestBody:
                required: true
                content:
                  application/json:
                    schema: { $ref: '#/components/schemas/PayWebhookEvent' }
              responses:
                '200': { description: Event durably accepted or duplicate acknowledged. }
                default: { description: Delivery will retry within its bounded retry cycle. }
  /api/pay/webhook-deliveries:
    post:
      operationId: redeliverMerchantWebhook
      tags: [Merchant]
      security: []
      description: Session and same-origin mutation; acknowledges replay and explicitly binds to the current endpoint version. Delivery is at least once and the receiver must deduplicate the stable event ID.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookRedelivery' }
      responses:
        '200': { description: Redelivery queued. }
        default: { description: 'Authority, state or version conflict.' }
  /api/pay/settlement-center:
    get:
      operationId: getMerchantSettlementCenter
      tags: [Settlements]
      security: []
      description: Session-only saved destinations, balances, approval threshold and maximum scheduling days.
      responses:
        '200': { description: Settlement center. }
        default: { description: Unauthorized or unavailable. }
  /api/pay/settlement-destinations:
    post:
      operationId: createSettlementDestination
      tags: [Settlements]
      security: []
      description: Session and same-origin mutation; save an owned destination with immutable address and rail. Create a new profile to change either fact.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [label, railId, destination], properties: { label: { type: string }, railId: { type: string }, destination: { type: string } } } } } }
      responses:
        '201': { description: Saved destination. }
        default: { description: Invalid destination or authority. }
    patch:
      operationId: updateSettlementDestination
      tags: [Settlements]
      security: []
      description: Session and same-origin mutation; version claims updates to label and/or active state. Destination and rail cannot be edited.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [id, version], properties: { id: { type: string }, version: { type: integer, minimum: 0 }, label: { type: string }, active: { type: boolean } } } } } }
      responses:
        '200': { description: Updated destination. }
        default: { description: Invalid change or version conflict. }
  /api/pay/settlement-receipt:
    get:
      operationId: getMerchantSettlementReceipt
      tags: [Settlements]
      security: []
      description: Session-only read-only receipt. HTML is an attachment and distinguishes unpaid from paid; it does not initiate a payout.
      parameters:
        - { in: query, name: id, required: true, schema: { type: string } }
        - { in: query, name: format, schema: { type: string, enum: [html] }, description: Omit for JSON. }
      responses:
        '200': { description: JSON settlement or private HTML receipt. }
        default: { description: Unauthorized or not found. }
  /api/admin/mobocom-pay/settlement-center:
    get:
      operationId: getAdminSettlementQueue
      tags: [Settlements]
      security: []
      description: Session and mobocom-pay.settle permission; filters phase, status, q and page.
      responses:
        '200': { description: 'Paginated queue with due, scheduled, second-approval and approved counts.' }
        default: { description: Unauthorized or invalid filter. }
  /api/admin/mobocom-pay/settlement-batches:
    post:
      operationId: decideSettlementBatch
      tags: [Settlements]
      security: []
      description: Session, same-origin and mobocom-pay.settle permission; each item is independently claimed and returns its own result.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [action, items], properties: { action: { type: string, enum: [approve, reject] }, reason: { type: string }, items: { type: array, minItems: 1, maxItems: 25, items: { type: object, additionalProperties: false, required: [id, version], properties: { id: { type: string }, version: { type: integer, minimum: 0 } } } } } } } } }
      responses:
        '200': { description: Per-item decision results. }
        default: { description: Invalid batch or authority. }
  /api/admin/mobocom-pay/webhooks:
    get:
      operationId: getAdminWebhooks
      tags: [Merchant]
      security: []
      description: Session and mobocom-pay.manage permission; page and status filter delivery evidence, endpointPage independently pages the endpoint directory. deliveryEndpoints includes the current binding for each delivery on the selected page. No signing secrets are returned.
      responses:
        '200': { description: Admin delivery and endpoint overview; mobocom-pay.manage required. }
        default: { description: Unauthorized. }
    patch:
      operationId: pauseAdminWebhook
      tags: [Merchant]
      security: []
      description: Session, same-origin and mobocom-pay.manage permission; pause an endpoint with its current version. This does not retract a request already in flight.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [id, version, active], properties: { id: { type: string, format: uuid }, version: { type: integer, minimum: 0 }, active: { type: boolean, enum: [false] } } } } } }
      responses:
        '200': { description: Endpoint paused with version claim. }
        default: { description: Invalid request or authority. }
  /api/admin/mobocom-pay/webhook-deliveries:
    post:
      operationId: redeliverAdminWebhook
      tags: [Merchant]
      security: []
      description: Session, same-origin and mobocom-pay.manage permission; explicit replay acknowledgment and current endpoint version are required. The immutable event is queued again with the current endpoint binding.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookRedelivery' } } } }
      responses:
        '200': { description: Explicit redelivery queued; mobocom-pay.manage required. }
        default: { description: Invalid request or authority. }
  /api/admin/mobocom-pay/settlement-receipt:
    get:
      operationId: getAdminSettlementReceipt
      tags: [Settlements]
      security: []
      description: Session and mobocom-pay.settle permission; read persisted settlement facts as JSON or an HTML attachment with print styling. This never initiates a transfer.
      parameters:
        - { in: query, name: id, required: true, schema: { type: string } }
        - { in: query, name: format, schema: { type: string, enum: [html] } }
      responses:
        '200': { description: Read-only JSON or private HTML receipt; mobocom-pay.settle required. }
        default: { description: Unauthorized or not found. }
  /api/payment/mobocom-pay/sms-forwarder/{id}:
    post:
      operationId: receiveForwardedBankSms
      tags: [Bank bridge]
      security: []
      description: >-
        Three-field FORWARDER_V1 source intake. The generated per-source token authenticates in the body;
        no bearer token is required. The bank must equal the source's configured bank. Only server receipt
        time is available, so previously unseen historical SMS cannot be distinguished from fresh messages.
        For a locked USDT purchase quote this evidence alone cannot approve credit; a successful receipt may
        report reviewRequired and PAY_PURCHASE_TIME_REQUIRED. Configure the phone to forward only fresh
        messages from the bank sender. Requests must satisfy the same-site Origin policy.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sms, bank, token]
              properties:
                sms: { type: string, minLength: 1, maxLength: 4096, description: Nonblank bank message text. }
                bank: { type: string, pattern: '^[a-z0-9_]{3,40}$', description: Fixed bank code configured for this source. }
                token: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true, description: Per-source generated credential shown once. }
      responses:
        '200': { description: 'Evidence recorded or replay acknowledged. A locked USDT quote may return financialApproval=false, reviewRequired=true and code=PAY_PURCHASE_TIME_REQUIRED.' }
        default: { description: 'Authentication, origin, source, body, strict rate limit or availability failure.' }
  /api/payment/mobocom-pay/sms/{id}:
    post:
      operationId: receiveConfiguredBankSms
      tags: [Bank bridge]
      description: Authenticated SMS Forwarder original event. received_at is the original device receipt time in UTC, not a date in bank text. Fresh first deliveries only; exact replays are idempotent. Sender/template/source bind the destination. Matching requires the globally unique collected amount and current authority. No customer-provided attribution.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message_id, sender, message, received_at]
              properties:
                message_id: { type: string, minLength: 1, maxLength: 120 }
                sender: { type: string, minLength: 1, maxLength: 80 }
                message: { type: string, minLength: 1, maxLength: 4096 }
                received_at: { type: string, format: date-time }
      responses:
        '200': { description: Immutable evidence recorded or exact replay acknowledged; matching may settle one collection. }
        default: { description: 'Authentication, source, body, freshness, strict rate limit or availability failure.' }
  /api/payment/mobocom-pay/collections/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{32}$' } }
    get:
      operationId: getAutomaticTransferCheckout
      tags: [Hosted checkout]
      security: []
      description: Opaque invoice capability; Pay additionally requires its scoped OTP ticket. Returns serverTime, quote expiry and PENDING/UNDER_REVIEW/PAID/EXPIRED/REVIEW. Instructions only for accepted, eligible pending requests. UNDER_REVIEW has no countdown or automatic expiry. Optional usdt is a display-only BSC/BEP20 equivalent from the canonical approved USDT Toman rate, with rate timestamp and unavailable/stale status; it never changes invoice money or enables a crypto transfer.
      responses:
        '200':
          description: Current checkout and safe receipt status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      usdt: { $ref: '#/components/schemas/UsdtEquivalent' }
                      orderRial: { $ref: '#/components/schemas/Rial' }
                      customerFeeRial: { $ref: '#/components/schemas/Rial' }
                      merchantFeeRial: { $ref: '#/components/schemas/Rial' }
        default: { description: 'Invalid capability, payer proof or unavailable method.' }
    post:
      operationId: changeAutomaticTransferCheckout
      tags: [Hosted checkout]
      security: []
      description: Same-origin mutation. accept discloses the separate addition; renew creates a fresh unique amount after expiry or receipt rejection. Old proof/history remains. No renewal under receipt review.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [action], properties: { action: { type: string, enum: [accept, renew] } } }
      responses:
        '200': { description: Current or renewed checkout. }
        default: { description: 'Invalid transition, payer, origin, source or strict rate limit.' }
  /api/payment/mobocom-pay/collections/{id}/receipt:
    post:
      operationId: submitAutomaticTransferReceipt
      tags: [Hosted checkout]
      security: []
      description: Same-origin capability and scoped Pay payer authorization. Bounded sniffed image. Omitted paidAmountRial uses the exact collected amount from the quote. A supplied amount must equal the quote principal or exact collected amount. Atomically creates the canonical receipt and enters UNDER_REVIEW without confirming payment. Replays preserve the first receipt.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{32}$' } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, payerName]
              properties:
                image: { type: string, format: binary }
                payerName: { type: string }
                trackingCode: { type: string }
                paidAmountRial: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
      responses:
        '200': { description: Current checkout with receipt hold. }
        default: { description: 'Receipt, origin, payer, state, deadline or strict rate limit failure.' }
  /api/payment/mobocom-pay/bale-events:
    post:
      operationId: receiveBaleOriginalBankMessage
      tags: [Bank bridge]
      deprecated: true
      security: []
      description: Retired bank connector. Configure an SMS source for automatic card transfer.
      responses:
        '410':
          description: The connector endpoint has been retired.
          content:
            application/json:
              schema:
                type: object
                required: [ok, error, code]
                properties:
                  ok: { type: boolean, enum: [false] }
                  error: { type: string }
                  code: { type: string, enum: [PAY_SOURCE_RETIRED] }
  /api/v1/pay/bot/{id}:
    post:
      operationId: createCustomBotPayment
      tags: [Custom bot]
      security: []
      description: >-
        Authenticate api_key using the dedicated terminal integration key, never a bot token or ordinary
        bearer key. amount is integer Toman (ten IRR). Numeric and canonical decimal-string amounts and
        user IDs are equivalent. Replaying the same integration/order/amount/user/type returns the same
        hosted checkout. Changed financial or customer identity claims conflict. Optional integer fields
        accept numbers or canonical decimal strings; null, empty strings and omission mean missing.
        payment_count and membership_days may select a routing rule. register and balance are compatibility
        fields. Customer history is never bank evidence or identity proof and is not persisted. Up to 12 ordered rules match exact Toman amount,
        type and claimed payment count and membership days; missing history cannot meet a positive threshold.
        A matched rule freezes its selected compatible gateway refs on the single payment and delivery;
        replay retains that snapshot. Available methods are intersected with the snapshot at use time;
        if none remain available the request fails closed. With no match, legacy compatible methods apply.
        LINKS mode returns one link per available snapshotted method (up to five), all to the same payment;
        without a matching rule it returns the existing single link. A method query is only a preference and
        never bypasses browser OTP or the server allowlist. All errors use the
        unwrapped ok=false/message response. PAID queues POST to the registered merchant-origin HTTPS
        /api/payment with the separate Token header and order_id/actions=custom_payment_verify body.
        Unknown acknowledgments never automatically resend; the merchant explicitly reviews recovery.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BotPaymentCreate' }
      responses:
        '200':
          description: Created or replayed hosted payment; response mode belongs to this integration.
          content:
            application/json:
              schema:
                oneOf:
                  - { type: object, required: [url], additionalProperties: false, properties: { url: { type: string, format: uri } } }
                  - type: object
                    required: [links]
                    additionalProperties: false
                    properties:
                      links:
                        type: array
                        minItems: 1
                        maxItems: 5
                        items: { type: object, required: [text, url], properties: { text: { type: string }, url: { type: string, format: uri } } }
        default:
          description: Invalid request, key, conflict, strict rate limit, disabled module or unavailable collection (400, 401, 403, 404, 409, 413, 422, 429, 503).
          content:
            application/json:
              schema: { type: object, required: [ok, message], additionalProperties: false, properties: { ok: { type: boolean, enum: [false] }, message: { type: string } } }
  /api/pay/checkout/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{32}$' } }]
    get:
      operationId: getHostedPayCheckout
      tags: [Hosted checkout]
      security: []
      description: Retrieve price and merchant summary; bank details and methods are withheld until the browser has its scoped OTP cookie.
      responses:
        '200': { description: Hosted checkout state, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: reportHostedPayReference
      tags: [Hosted checkout]
      security: []
      description: Report a reference hint after OTP proof. Requires the HttpOnly pay_payer_ID cookie. This never confirms a payment.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [transferReference], properties: { transferReference: { type: string, minLength: 6, maxLength: 64 } } } } } }
      responses:
        '200': { description: Updated checkout state, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/pay/checkout/{id}/otp:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: requestHostedPayOtp
      tags: [Hosted checkout]
      security: []
      description: Issue a canonical SMS challenge scoped to this payment and browser; sets an HttpOnly challenge cookie. Never returns a code or challenge secret in JSON.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone, humanToken], properties: { phone: { type: string }, humanToken: { type: string } } } } } }
      responses:
        '200': { description: Challenge delivery state and resend timing, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, data: { type: object, properties: { expiresIn: { type: integer }, resendIn: { type: integer }, notice: { type: string } } } } } } } }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: verifyHostedPayOtp
      tags: [Hosted checkout]
      security: []
      description: Consume the payment-and-browser-bound code, clear its challenge cookie and set a scoped HttpOnly payer ticket. No global login or User is created.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone, code], properties: { phone: { type: string }, code: { type: string, pattern: '^\d{6}$' } } } } } }
      responses:
        '200': { description: Verified phone last four digits, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, data: { type: object, properties: { verified: { type: boolean }, phoneLast4: { type: string } } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/pay/checkout/{id}/gateway:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: startHostedPayGateway
      tags: [Hosted checkout]
      security: []
      description: Requires scoped payer cookie; claims one active canonical gateway and real collection invoice. Ambiguous attempts never blindly create again. External bot redirects are refused.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [gatewayRef], properties: {"gatewayRef":{"type":"string"},"acceptPurchase":{"type":"boolean","description":"True only after explicit verified-payer acknowledgement of purchase terms."},"purchaseTermsHash":{"type":"string","description":"Immutable checkout purchase terms hash; required for USDT acquisition."}} } } } }
      responses:
        '200': { description: Gateway initiation state, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, data: { type: object, properties: { invoiceId: { type: integer }, gatewayRef: { type: string }, provider: { type: string }, manual: { type: boolean }, paymentUrl: { type: string }, status: { type: string, enum: [READY, STARTING, UNKNOWN, FAILED] } } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/pay/checkout/{id}/receipt:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: uploadHostedPayReceipt
      tags: [Hosted checkout]
      security: []
      description: Requires scoped payer cookie and a manual collection invoice. Name and image are required. Image type is sniffed and bounded to 6MiB. A pending receipt does not confirm payment. When the customer omits trackingCode, staff must record a verified bank reference before manually confirming an unpaid merchant payment.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, payerName]
              properties:
                image: { type: string, format: binary }
                payerName: { type: string }
                payerBank: { type: string }
                payerCard: { type: string, description: Source card last four digits only. }
                trackingCode: { type: string, minLength: 6, maxLength: 64 }
                method: { type: string, enum: [CARD, PAYA, SATNA, ACCOUNT] }
      responses:
        '201': { description: Receipt pending review or bank matching, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, data: { type: object, properties: { id: { type: integer }, status: { type: string } } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/pay/overview:
    get:
      operationId: payOverview
      tags: [Merchant]
      description: Retrieve the current merchant's account, activity and readiness.
      responses:
        '200': { description: Merchant overview, content: { application/json: { schema: { $ref: '#/components/schemas/OverviewResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/pay/terminals:
    get:
      operationId: listPayTerminals
      tags: [Merchant]
      description: List the current merchant's terminals.
      responses:
        '200': { description: Terminals, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalListResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createPayTerminal
      tags: [Merchant]
      description: Create a terminal for the active merchant.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalCreate' } } } }
      responses:
        '201': { description: Terminal created, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: changePayTerminal
      tags: [Merchant]
      description: Enable or disable an existing merchant terminal.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalChange' } } } }
      responses:
        '200': { description: Terminal updated, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/pay/payments:
    get:
      operationId: listPayPayments
      tags: [Payments]
      description: List or export the current merchant's payments.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Query' }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, PAID, EXPIRED] } }
        - { $ref: '#/components/parameters/Format' }
      responses:
        '200': { description: Paginated payments or CSV export, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentListResponse' } }, text/csv: { schema: { type: string } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createPayPayment
      tags: [Payments]
      description: Create a payment or replay a matching request using its idempotency key.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentCreate' } } } }
      responses:
        '201': { description: Created or replayed payment, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/pay/payments/{id}:
    get:
      operationId: getPayPayment
      tags: [Payments]
      description: Retrieve this merchant's payment and verify PAID before fulfillment.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Payment, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/pay/quotes:
    post:
      operationId: createPayQuote
      tags: [Settlements]
      description: Quote an enabled settlement rail using available withdrawable proceeds.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteCreate' } } } }
      responses:
        '201': { description: Short-lived settlement quote, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/pay/settlements:
    get:
      operationId: listPaySettlements
      tags: [Settlements]
      description: List or export the current merchant's settlement requests.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Query' }
        - { name: status, in: query, schema: { type: string, enum: [REQUESTED, APPROVED, PAID, REJECTED] } }
        - { $ref: '#/components/parameters/Format' }
      responses:
        '200': { description: Paginated settlements or CSV export, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementListResponse' } }, text/csv: { schema: { type: string } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: requestPaySettlement
      tags: [Settlements]
      description: Reserve proceeds for a quoted settlement or replay a matching request.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementCreate' } } } }
      responses:
        '201': { description: Settlement requested or replayed, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/payment/mobocom-pay/bank-events:
    post:
      operationId: acceptPayBankEvent
      tags: [Bank bridge]
      security: []
      description: >-
        Signed bank bridge, not the merchant API. Sign the exact raw JSON bytes with HMAC-SHA256 over
        timestamp + '.' + body. The timestamp is Unix seconds within 300 seconds; the lowercase hex
        signature uses the configured secret. Maximum body size is 8000 bytes. targetPaymentId must
        be bank-attested for automatic credit; an unbound event is stored unmatched and cannot credit.
        A provider adapter must derive attribution from authoritative bank data; none is provided yet.
      parameters:
        - { name: x-pay-timestamp, in: header, required: true, schema: { type: string, pattern: '^\d{10}$' } }
        - { name: x-pay-signature, in: header, required: true, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BankEvent' } } } }
      responses:
        '200': { description: Accepted or replayed event, content: { application/json: { schema: { $ref: '#/components/schemas/BankEventResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v2/pay/overview:
    get:
      operationId: v2PayOverview
      tags:
        - Merchant
      description: Retrieve the current merchant's account, activity and readiness.
      responses:
        "200":
          description: Merchant overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v2/pay/terminals:
    get:
      operationId: v2ListPayTerminals
      tags:
        - Merchant
      description: List the current merchant's terminals.
      responses:
        "200":
          description: Terminals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: v2CreatePayTerminal
      tags:
        - Merchant
      description: Create a terminal for the active merchant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalCreate"
      responses:
        "201":
          description: Terminal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalResponse"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: v2ChangePayTerminal
      tags:
        - Merchant
      description: Enable or disable an existing merchant terminal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalChange"
      responses:
        "200":
          description: Terminal updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v2/pay/terminals/{id}/gateways:
    get:
      operationId: v2ListPayTerminalGateways
      tags:
        - Merchant
      description: >-
        Read-only catalog of payment gateways currently eligible for this active merchant's terminal.
        Accepts either a merchant Bearer key or a limited terminal Bearer key (`mcpterm_` followed
        by 64 hexadecimal characters). Terminal keys are issued, rotated, or revoked by the Pay
        platform administrator; their secret is shown only at issuance or rotation. A terminal key
        is bound to one terminal and only authorizes this catalog, payment creation, and payment
        retrieval for that same terminal. Other v2 resources return 403 PAY_TERMINAL_KEY_SCOPE.
        Requires an active MoboCom Pay module and
        section. The terminal must belong to the active merchant; a disabled terminal is returned with
        an empty items array. A terminal key accessing another terminal receives 404. When amountRial is supplied, it must follow the Rial grammar and the
        server calculates the gross charge from current merchant fee terms, returning only methods
        compatible with that amount, provider precision, and configured payout account. Catalog refs
        are opaque and can be passed unchanged as gatewayRef when creating a v2 payment. Availability
        is a snapshot; payment creation validates the ref again.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: amountRial
          in: query
          required: false
          description: Optional exact integer amount in IRR, using the Rial schema grammar.
          schema: { $ref: "#/components/schemas/Rial" }
      responses:
        "200":
          description: Eligible gateway catalog; data is empty for a disabled terminal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalGatewayListResponse" }
        "401": { description: Missing or invalid bearer token; a revoked or rotated terminal key returns PAY_TERMINAL_KEY_INVALID. }
        "403": { description: Bearer identity has no active merchant context or the Pay section is unavailable. }
        "404": { description: Terminal not found for the active merchant or not bound to this terminal key. }
        "422": { description: Invalid amountRial. }
        "503": { description: No payment method is currently ready for this terminal. }
        default:
          $ref: "#/components/responses/Error"
  /api/v2/pay/payments:
    get:
      operationId: v2ListPayPayments
      tags:
        - Payments
      description: List or export the current merchant's payments.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Query"
        - name: status
          in: query
          schema:
            type: string
            enum:
              - PENDING
              - PAID
              - EXPIRED
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Paginated payments or CSV export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentListResponse"
            text/csv:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: v2CreatePayPayment
      tags:
        - Payments
      description: >-
        Create a payment or replay a matching request using its idempotency key. Optional gatewayRef
        must exactly match a ref returned by the terminal gateway catalog. When supplied, it is part
        of the idempotency request binding; replaying the same key with a different value conflicts.
        Omit it to preserve existing gateway selection behavior. Legacy v1 requests and signed
        callbacks/webhooks are unchanged. A terminal key (`mcpterm_` plus 64 hex characters) may be
        used instead of a merchant key only when terminalId is its bound terminal; a foreign
        terminal returns 404. Terminal keys are issued, rotated, and revoked by the Pay platform
        administrator and their secret is shown only at issuance or rotation. They authorize only
        this operation, the gateway catalog, and retrieval of payments for the bound terminal; other
        v2 resources return 403 PAY_TERMINAL_KEY_SCOPE. Revoked or rotated terminal keys return 401
        PAY_TERMINAL_KEY_INVALID. Existing same-site Origin validation for writes still applies.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCreate"
      responses:
        "201":
          description: Created or replayed payment; requestedGatewayRef is present only when requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "409": { description: "Idempotency key was already used with a different request, including a different gatewayRef." }
        "422": { description: "Requested gatewayRef is unknown, no longer eligible, or incompatible with this payment; application code PAY_GATEWAY_NOT_AVAILABLE." }
        "503": { description: "No gateway is ready for this terminal; application code PAY_NOT_READY." }
        "401": { description: Revoked or rotated terminal key returns PAY_TERMINAL_KEY_INVALID. }
        "404": { description: Terminal is not found for this merchant or is not bound to this terminal key. }
        default:
          $ref: "#/components/responses/Error"
  /api/v2/pay/payments/{id}:
    get:
      operationId: v2GetPayPayment
      tags:
        - Payments
      description: Retrieve this merchant's payment and verify PAID before fulfillment.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "401": { description: Revoked or rotated terminal key returns PAY_TERMINAL_KEY_INVALID. }
        "403": { description: A terminal key can retrieve only payments for its bound terminal; other v2 resources return PAY_TERMINAL_KEY_SCOPE. }
        "404": { description: Payment is not found for this merchant or belongs to another terminal key. }
        default:
          $ref: "#/components/responses/Error"
  /api/v2/pay/quotes:
    post:
      operationId: v2CreatePayQuote
      tags:
        - Settlements
      description: Quote an enabled settlement rail using available withdrawable proceeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetQuoteCreate"
      responses:
        "201":
          description: Short-lived settlement quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetQuoteResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v2/pay/settlements:
    get:
      operationId: v2ListPaySettlements
      tags:
        - Settlements
      description: List or export the current merchant's settlement requests.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Query"
        - name: status
          in: query
          schema:
            type: string
            enum:
              - REQUESTED
              - APPROVED
              - PAID
              - REJECTED
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Paginated settlements or CSV export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementListResponse"
            text/csv:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: v2RequestPaySettlement
      tags:
        - Settlements
      description: Reserve proceeds for a quoted settlement or replay a matching request.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementCreate"
      responses:
        "201":
          description: Settlement requested or replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementResponse"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, description: "Use the existing merchant Bearer key for normal merchant API access. A limited terminal key has format mcpterm_ followed by 64 hexadecimal characters and may only access GET /api/v2/pay/terminals/{id}/gateways, POST /api/v2/pay/payments, and GET /api/v2/pay/payments/{id}, all bound to its one terminal. Other v2 resources return 403 PAY_TERMINAL_KEY_SCOPE; revoked/rotated terminal keys return 401 PAY_TERMINAL_KEY_INVALID. The Pay platform administrator issues, rotates, and revokes terminal keys; the secret is shown only at issuance/rotation. Existing legacy credentials/endpoints and same-site Origin validation for writes remain supported." }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, description: Reuse the same key and payload for retries; a different payload conflicts., schema: { type: string, minLength: 16, maxLength: 100, pattern: '^[A-Za-z0-9_-]+$' } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000 } }
    Query: { name: q, in: query, schema: { type: string, maxLength: 100 } }
    Format: { name: format, in: query, description: csv exports at most 1000 entries., schema: { type: string, enum: [csv] } }
  responses:
    Error:
      description: Invalid request, authentication or access denied, conflict, rate limit, or unavailable service (400, 401, 403, 404, 405, 409, 413, 422, 429, 503).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    WebhookRedelivery:
      type: object
      additionalProperties: false
      required: [id, version, configVersion, action, ackReplay]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0, description: Current delivery version. }
        configVersion: { type: integer, minimum: 1, description: Current endpoint version. }
        action: { type: string, enum: [redeliver] }
        ackReplay: { type: boolean, enum: [true] }
    PayWebhookEvent:
      type: object
      additionalProperties: false
      required: [id, type, version, created_at, data]
      description: >-
        Stable event body delivered at least once through the canonical background queue. Receiver must
        deduplicate id. Each attempt includes X-MoboCom-Event-Id, X-MoboCom-Attempt-Id,
        X-MoboCom-Timestamp (Unix seconds), and X-MoboCom-Signature (v1= followed by hex HMAC-SHA256
        over timestamp + '.' + exact raw body). All non-2xx responses and transport errors retry up to
        eight attempts per delivery cycle; manual redelivery starts a new cycle.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [payment.paid] }
        version: { type: integer, enum: [1] }
        created_at: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: false
          required: [payment_id, terminal_id, external_id, status, order_amount_rial, invoice_total_rial, contract_fee_rial, merchant_credit_currency, merchant_credit_amount]
          properties:
            payment_id: { type: string }
            terminal_id: { type: string }
            external_id: { type: string }
            status: { type: string, enum: [PAID] }
            order_amount_rial: { type: string }
            invoice_total_rial: { type: string }
            contract_fee_rial: { type: string }
            merchant_credit_currency: { type: string, enum: [IRR, USDT] }
            merchant_credit_amount: { type: string, description: Exact decimal credit in merchant currency. }
    UsdtEquivalent:
      type: object
      description: Informational equivalent of the full requested Rial amount. Approved persisted USDT rate only; no USD peg fallback or provider call on checkout. Four decimal rounding; lessThan marks a sub-0.0001 amount. Provider rates older than 24 hours are stale; explicit manual or locked rates are labeled with their original timestamp.
      required: [asset, network, standard, displayOnly, status, amount, lessThan, rateToman, asOf, manual]
      properties:
        asset: { type: string, enum: [USDT] }
        network: { type: string, enum: [BSC] }
        standard: { type: string, enum: [BEP20] }
        displayOnly: { type: boolean, enum: [true] }
        status: { type: string, enum: [AVAILABLE, STALE, UNAVAILABLE] }
        amount: { type: string, nullable: true, pattern: '^[0-9]+\.[0-9]{4}$' }
        lessThan: { type: boolean }
        rateToman: { type: string, nullable: true }
        asOf: { type: string, format: date-time, nullable: true }
        manual: { type: boolean }
    BotPaymentCreate:
      type: object
      additionalProperties: false
      required: [api_key, amount, order_id, user_id, type]
      properties:
        api_key: { type: string, writeOnly: true, pattern: '^mcpbot_[A-Za-z0-9_-]{43}$' }
        amount:
          description: Exact Toman, 1 to 900000000000000 in either representation. Configured payment limits also apply.
          oneOf:
            - { type: integer, minimum: 1, maximum: 900000000000000 }
            - { type: string, pattern: '^(?:[1-9][0-9]{0,13}|[1-8][0-9]{14}|900000000000000)$' }
        order_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$' }
        user_id:
          description: Bot customer claim, independent of the canonical MoboCom UserId. Both forms represent the same positive integer, up to 9007199254740991.
          oneOf:
            - { type: integer, minimum: 1, maximum: 9007199254740991 }
            - { type: string, pattern: '^[1-9][0-9]{0,15}$' }
        type: { type: string, enum: [purchase, renewal, balance_increase] }
        username: { type: string, nullable: true, pattern: '^[A-Za-z0-9_]{0,64}$' }
        first_name: { type: string, nullable: true, maxLength: 160 }
        payment_count: { $ref: '#/components/schemas/BotOptionalNonNegativeInteger' }
        register: { $ref: '#/components/schemas/BotOptionalNonNegativeInteger' }
        membership_days:
          description: Routing claim. Missing or -1 cannot meet a positive threshold.
          oneOf:
            - { type: integer, minimum: -1, maximum: 9007199254740991 }
            - { type: string, nullable: true, pattern: '^(?:-1|0|[1-9][0-9]{0,15})?$' }
        balance: { $ref: '#/components/schemas/BotOptionalNonNegativeInteger' }
    BotOptionalNonNegativeInteger:
      description: Zero to 9007199254740991 in either representation; null or an empty string means missing.
      oneOf:
        - { type: integer, minimum: 0, maximum: 9007199254740991 }
        - { type: string, nullable: true, pattern: '^(?:0|[1-9][0-9]{0,15})?$' }
    CheckoutResponse:
      type: "object"
      required: ["ok","data"]
      properties:
        ok: {"type":"boolean","enum":[true]}
        data: {"type":"object","required":["id","amountRial","totalRial","feeRial","feeBearer","status","verification","gateways","bank","receipt"],"properties":{"id":{"type":"string"},"amountRial":{"$ref":"#/components/schemas/Rial"},"totalRial":{"$ref":"#/components/schemas/Rial"},"feeRial":{"$ref":"#/components/schemas/Rial"},"customerFeeRial":{"$ref":"#/components/schemas/Rial"},"merchantFeeRial":{"$ref":"#/components/schemas/Rial"},"feeBearer":{"type":"string","enum":["MERCHANT","CUSTOMER"]},"status":{"type":"string","enum":["PENDING","PAID","EXPIRED"]},"verification":{"type":"object","required":["verified","phoneLast4"],"properties":{"verified":{"type":"boolean"},"phoneLast4":{"type":"string"}}},"gateways":{"type":"array","items":{"type":"object","properties":{"ref":{"type":"string"},"name":{"type":"string"},"provider":{"type":"string"},"manual":{"type":"boolean"},"automatic":{"type":"boolean"}}}},"bank":{"type":"object","nullable":true,"description":"Withheld before OTP proof or a card-transfer selection."},"receipt":{"type":"object","nullable":true},"botDelivery":{"type":"object","description":"Included only for a verified payer on a PAID bot payment.","properties":{"status":{"type":"string","enum":["WAITING","QUEUED","SENDING","SENT","UNKNOWN","BLOCKED"]}}},"purchase":{"$ref":"#/components/schemas/MerchantPurchase"}}}
    Error:
