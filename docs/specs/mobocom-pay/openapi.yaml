    Payment: {"type":"object","required":["id","externalId","terminalId","terminalName","amountRial","feeRial","netRial","totalRial","feeBearer","status","transferReference","createdAt","paidAt","expiresAt","checkoutUrl"],"properties":{"id":{"type":"string"},"externalId":{"type":"string"},"terminalId":{"type":"string"},"terminalName":{"type":"string"},"amountRial":{"$ref":"#/components/schemas/Rial"},"totalRial":{"$ref":"#/components/schemas/Rial"},"customerFeeRial":{"$ref":"#/components/schemas/Rial"},"merchantFeeRial":{"$ref":"#/components/schemas/Rial"},"feeBearer":{"type":"string","enum":["MERCHANT","CUSTOMER"],"description":"Legacy payer marker. A shared fee retains MERCHANT and exposes both exact fee parts."},"feeRial":{"$ref":"#/components/schemas/Rial"},"netRial":{"$ref":"#/components/schemas/Rial"},"status":{"type":"string","enum":["PENDING","PAID","EXPIRED"]},"transferReference":{"type":"string"},"createdAt":{"type":"string","format":"date-time"},"paidAt":{"type":"string","format":"date-time","nullable":true},"expiresAt":{"type":"string","format":"date-time"},"checkoutUrl":{"type":"string"},"requestedGatewayRef":{"type":"string","description":"Present only when gatewayRef was requested at creation."},"creditCurrency":{"type":"string","enum":["IRR","USDT"]},"creditAmount":{"type":"string","description":"Exact immutable credit to the merchant; USDT has two canonical internal decimals."},"settledServiceFeeRial":{"$ref":"#/components/schemas/Rial"},"platformFeeRial":{"$ref":"#/components/schemas/Rial"},"creditRial":{"$ref":"#/components/schemas/Rial"},"customerAmountRial":{"$ref":"#/components/schemas/Rial"},"confirmation":{"$ref":"#/components/schemas/PayConfirmation"},"reviewStatus":{"type":"string","enum":["UNDER_REVIEW"],"description":"Optional review detail while the stable machine payment status remains PENDING. Native merchant/checkout UI shows UNDER_REVIEW."}}}
    QuoteCreate: {"type":"object","required":["railId","amountRial"],"properties":{"railId":{"type":"string","enum":["IRR_BANK","TRX_TRON","USDT_TRON"]},"amountRial":{"$ref":"#/components/schemas/Rial"}}}
    Quote: {"allOf":[{"$ref":"#/components/schemas/QuoteCreate"},{"type":"object","required":["id","feeRial","payoutAmount","asset","network","rateRialPerUnit","expiresAt"],"properties":{"id":{"type":"string"},"feeRial":{"$ref":"#/components/schemas/Rial"},"payoutAmount":{"type":"string"},"asset":{"type":"string"},"network":{"type":"string"},"rateRialPerUnit":{"type":"string"},"expiresAt":{"type":"string","format":"date-time"}}}]}
    SettlementCreate:
