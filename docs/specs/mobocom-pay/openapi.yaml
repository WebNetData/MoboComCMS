openapi: 3.0.3
info:
  title: MoboComPay merchant API
  version: 1.6.0
  contact: { url: 'https://github.com/WebNetData/MoboComCMS' }
  description: >-
    An active merchant and terminal are provisioned through the account interface before using this API.
    Before fulfilling an order, retrieve its payment by ID and confirm status PAID. A customer reference
    alone is not confirmation. Hosted checkout requires a browser-bound phone OTP before payment instructions,
    receipt upload or provider initiation. Existing compatible MoboCom gateways are reused. A terminal-scoped
    custom-bot adapter can send paid-order verification through the existing job queue. No production bank
    source has been live-verified by this repository. Fees snapshot a merchant-specific bearer and total cap.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - { name: Merchant, description: Merchant account and terminals. }
  - { name: Payments, description: Payment creation and verification. }
  - { name: Settlements, description: Settlement quotes and requests. }
  - { name: Bank bridge, description: Signed bank event ingestion. }
  - { name: Hosted checkout, description: Guest phone proof and payment methods on the MoboCom domain. }
  - { name: Custom bot, description: Dedicated body-token compatibility adapter and conservative paid-order delivery. }
paths:
  /api/payment/mobocom-pay/sms/{id}:
    post:
      operationId: receiveConfiguredBankSms
      tags: [Bank bridge]
      description: Authenticated SMS Forwarder original event. received_at is the original device receipt time in UTC, not a date in bank text. Fresh first deliveries only; exact replays are idempotent. Sender/template/source bind the destination. Matching requires the globally unique collected amount and current authority. No customer-provided attribution.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message_id, sender, message, received_at]
              properties:
                message_id: { type: string, minLength: 1, maxLength: 120 }
                sender: { type: string, minLength: 1, maxLength: 80 }
                message: { type: string, minLength: 1, maxLength: 4096 }
                received_at: { type: string, format: date-time }
      responses:
        '200': { description: Immutable evidence recorded or exact replay acknowledged; matching may settle one collection. }
        default: { description: 'Authentication, source, body, freshness, strict rate limit or availability failure.' }
  /api/payment/mobocom-pay/collections/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{32}$' } }
    get:
      operationId: getAutomaticTransferCheckout
      tags: [Hosted checkout]
      security: []
      description: Opaque invoice capability; Pay additionally requires its scoped OTP ticket. Returns serverTime, quote expiry and PENDING/UNDER_REVIEW/PAID/EXPIRED/REVIEW. Instructions only for accepted, eligible pending requests. UNDER_REVIEW has no countdown or automatic expiry. Optional usdt is a display-only BSC/BEP20 equivalent from the canonical approved USDT Toman rate, with rate timestamp and unavailable/stale status; it never changes invoice money or enables a crypto transfer.
      responses:
        '200':
          description: Current checkout and safe receipt status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      usdt: { $ref: '#/components/schemas/UsdtEquivalent' }
        default: { description: 'Invalid capability, payer proof or unavailable method.' }
    post:
      operationId: changeAutomaticTransferCheckout
      tags: [Hosted checkout]
      security: []
      description: Same-origin mutation. accept discloses the separate addition; renew creates a fresh unique amount after expiry or receipt rejection. Old proof/history remains. No renewal under receipt review.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [action], properties: { action: { type: string, enum: [accept, renew] } } }
      responses:
        '200': { description: Current or renewed checkout. }
        default: { description: 'Invalid transition, payer, origin, source or strict rate limit.' }
  /api/payment/mobocom-pay/collections/{id}/receipt:
    post:
      operationId: submitAutomaticTransferReceipt
      tags: [Hosted checkout]
      security: []
      description: Same-origin capability and scoped Pay payer authorization. Bounded sniffed image; paidAmountRial equals the quote principal or exact collected amount. Atomically creates the canonical receipt and enters UNDER_REVIEW; never confirms money on upload. Replays preserve the first receipt.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{32}$' } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, payerName, paidAmountRial]
              properties:
                image: { type: string, format: binary }
                payerName: { type: string }
                trackingCode: { type: string }
                paidAmountRial: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
      responses:
        '200': { description: Current checkout with receipt hold. }
        default: { description: 'Receipt, origin, payer, state, deadline or strict rate limit failure.' }
  /api/payment/mobocom-pay/bale-events:
    post:
      operationId: receiveBaleOriginalBankMessage
      tags: [Bank bridge]
      security: []
      description: >-
        Dedicated self-hosted GoOmni2.4.2 original-message intake, not Bot API or
        personal-account login. X-Hub-Signature-256 authenticates exact bounded
        raw bytes with the deployment-owned per-destination secret. Event header
        must match event_id. Requires the preconfigured immutable connection,
        account and original bank peer. Reject duplicate JSON keys, wrong sender,
        forwarded, edited, outgoing, partial and unsupported messages. Minimal
        immutable facts commit before ACK. Replays are idempotent and changed
        bytes conflict. Eligible unique-amount collections may settle through canonical invoice claims; targetPaymentId is never accepted.
      parameters:
        - { in: header, name: X-Hub-Signature-256, required: true, schema: { type: string, pattern: '^sha256=[a-f0-9]{64}$' } }
        - { in: header, name: X-GoOmni-Event-Id, required: true, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, event, device_id, provider, session_id, instance_id, peer, message_id, sender_id, direction, timestamp, payload, content]
              properties:
                event_id: { type: string, pattern: '^[a-f0-9]{64}$' }
                event: { type: string, enum: [message] }
                device_id: { type: string }
                provider: { type: string, enum: [bale] }
                session_id: { type: string }
                instance_id: { type: string, pattern: '^[a-f0-9]{64}$' }
                peer: { type: object, required: [type, id], properties: { type: { type: string, enum: [user] }, id: { type: string } } }
                message_id: { type: string }
                sender_id: { type: string }
                direction: { type: string, enum: [incoming] }
                timestamp: { type: string, format: date-time }
                payload: { type: object, description: 'Pinned GoOmni complete text projection; id/chat_id/from/direction/timestamp must agree with the envelope. partial=false, supported=true, no forward/edit/reply provenance.' }
                content: { type: object, description: 'Pinned GoOmni native text content, kind=text and message equal to payload.body. At most4096 characters.' }
      responses:
        '200':
          description: Evidence committed or exact replay acknowledged; financialApproval reports the canonical collection result.
          headers: { Cache-Control: { schema: { type: string, enum: [no-store] } } }
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [received, id, duplicate, status, financialApproval]
                    properties:
                      received: { type: boolean, enum: [true] }
                      id: { type: string }
                      duplicate: { type: boolean }
                      status: { type: string, enum: [ORIGINAL_TRANSFER, IGNORED, REJECTED, DUPLICATE, CONFLICT] }
                      financialApproval: { type: boolean }
        '401': { description: Missing or invalid exact-body signature. }
        '403': { description: Current module/API/source owner authority is disabled. }
        '409': { description: Event/message identity conflicts with previously committed evidence. }
        '413': { description: Request exceeds24000 bytes. }
        '422': { description: 'Invalid or ambiguous JSON, identity, provenance or source timestamp.' }
        '429': { description: Strict request limit or daily source capacity reached; retry later. }
        '503': { description: Source/bank account unconfigured or persistence unavailable; retry later. }
  /api/v1/pay/bot/{id}:
    post:
      operationId: createCustomBotPayment
      tags: [Custom bot]
      security: []
      description: >-
        Authenticate api_key using the dedicated terminal integration key, never a bot token or ordinary
        bearer key. amount is integer Toman (ten IRR). Replaying the same integration/order/amount/user/type
        returns the same hosted checkout; changed financial or customer identity claims conflict. Optional
        customer history is validated and may select an opt-in merchant routing rule; it is never bank
        evidence or identity proof and is not persisted. Up to 12 ordered rules match exact Toman amount,
        type and claimed payment count and membership days; missing history cannot meet a positive threshold.
        A matched rule freezes its selected compatible gateway refs on the single payment and delivery;
        replay retains that snapshot. Available methods are intersected with the snapshot at use time;
        if none remain available the request fails closed. With no match, legacy compatible methods apply.
        LINKS mode returns one link per available snapshotted method (up to five), all to the same payment;
        without a matching rule it returns the existing single link. A method query is only a preference and
        never bypasses browser OTP or the server allowlist. All errors use the
        unwrapped ok=false/message response. PAID queues POST to the registered merchant-origin HTTPS
        /api/payment with the separate Token header and order_id/actions=custom_payment_verify body.
        Unknown acknowledgments never automatically resend; the merchant explicitly reviews recovery.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BotPaymentCreate' }
      responses:
        '200':
          description: Created or replayed hosted payment; response mode belongs to this integration.
          content:
            application/json:
              schema:
                oneOf:
                  - { type: object, required: [url], additionalProperties: false, properties: { url: { type: string, format: uri } } }
                  - type: object
                    required: [links]
                    additionalProperties: false
                    properties:
                      links:
                        type: array
                        minItems: 1
                        maxItems: 5
                        items: { type: object, required: [text, url], properties: { text: { type: string }, url: { type: string, format: uri } } }
        default:
          description: Invalid request, key, conflict, strict rate limit, disabled module or unavailable collection (400, 401, 403, 404, 409, 413, 422, 429, 503).
          content:
            application/json:
              schema: { type: object, required: [ok, message], additionalProperties: false, properties: { ok: { type: boolean, enum: [false] }, message: { type: string } } }
  /api/pay/checkout/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{32}$' } }]
    get:
      operationId: getHostedPayCheckout
      tags: [Hosted checkout]
      security: []
      description: Retrieve price and merchant summary; bank details and methods are withheld until the browser has its scoped OTP cookie.
      responses:
        '200': { description: Hosted checkout state, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: reportHostedPayReference
      tags: [Hosted checkout]
      security: []
      description: Report a reference hint after OTP proof. Requires the HttpOnly pay_payer_ID cookie. This never confirms a payment.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [transferReference], properties: { transferReference: { type: string, minLength: 6, maxLength: 64 } } } } } }
      responses:
        '200': { description: Updated checkout state, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/pay/checkout/{id}/otp:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: requestHostedPayOtp
      tags: [Hosted checkout]
      security: []
      description: Issue a canonical SMS challenge scoped to this payment and browser; sets an HttpOnly challenge cookie. Never returns a code or challenge secret in JSON.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone, humanToken], properties: { phone: { type: string }, humanToken: { type: string } } } } } }
      responses:
        '200': { description: Challenge delivery state and resend timing, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, data: { type: object, properties: { expiresIn: { type: integer }, resendIn: { type: integer }, notice: { type: string } } } } } } } }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: verifyHostedPayOtp
      tags: [Hosted checkout]
      security: []
      description: Consume the payment-and-browser-bound code, clear its challenge cookie and set a scoped HttpOnly payer ticket. No global login or User is created.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone, code], properties: { phone: { type: string }, code: { type: string, pattern: '^\d{6}$' } } } } } }
      responses:
        '200': { description: Verified phone last four digits, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, data: { type: object, properties: { verified: { type: boolean }, phoneLast4: { type: string } } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/pay/checkout/{id}/gateway:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: startHostedPayGateway
      tags: [Hosted checkout]
      security: []
      description: Requires scoped payer cookie; claims one active canonical gateway and real collection invoice. Ambiguous attempts never blindly create again. External bot redirects are refused.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [gatewayRef], properties: { gatewayRef: { type: string } } } } } }
      responses:
        '200': { description: Gateway initiation state, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, data: { type: object, properties: { invoiceId: { type: integer }, gatewayRef: { type: string }, provider: { type: string }, manual: { type: boolean }, paymentUrl: { type: string }, status: { type: string, enum: [READY, STARTING, UNKNOWN, FAILED] } } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/pay/checkout/{id}/receipt:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: uploadHostedPayReceipt
      tags: [Hosted checkout]
      security: []
      description: Requires scoped payer cookie and a manual collection invoice. Image type is sniffed and bounded to 6MiB; a pending receipt never confirms payment.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, payerName, trackingCode]
              properties:
                image: { type: string, format: binary }
                payerName: { type: string }
                payerBank: { type: string }
                payerCard: { type: string, description: Source card last four digits only. }
                trackingCode: { type: string, minLength: 6, maxLength: 64 }
                method: { type: string, enum: [CARD, PAYA, SATNA, ACCOUNT] }
      responses:
        '201': { description: Receipt pending review or bank matching, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, data: { type: object, properties: { id: { type: integer }, status: { type: string } } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/pay/overview:
    get:
      operationId: payOverview
      tags: [Merchant]
      description: Retrieve the current merchant's account, activity and readiness.
      responses:
        '200': { description: Merchant overview, content: { application/json: { schema: { $ref: '#/components/schemas/OverviewResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/pay/terminals:
    get:
      operationId: listPayTerminals
      tags: [Merchant]
      description: List the current merchant's terminals.
      responses:
        '200': { description: Terminals, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalListResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createPayTerminal
      tags: [Merchant]
      description: Create a terminal for the active merchant.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalCreate' } } } }
      responses:
        '201': { description: Terminal created, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: changePayTerminal
      tags: [Merchant]
      description: Enable or disable an existing merchant terminal.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalChange' } } } }
      responses:
        '200': { description: Terminal updated, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/pay/payments:
    get:
      operationId: listPayPayments
      tags: [Payments]
      description: List or export the current merchant's payments.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Query' }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, PAID, EXPIRED] } }
        - { $ref: '#/components/parameters/Format' }
      responses:
        '200': { description: Paginated payments or CSV export, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentListResponse' } }, text/csv: { schema: { type: string } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createPayPayment
      tags: [Payments]
      description: Create a payment or replay a matching request using its idempotency key.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentCreate' } } } }
      responses:
        '201': { description: Created or replayed payment, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/pay/payments/{id}:
    get:
      operationId: getPayPayment
      tags: [Payments]
      description: Retrieve this merchant's payment and verify PAID before fulfillment.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Payment, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/pay/quotes:
    post:
      operationId: createPayQuote
      tags: [Settlements]
      description: Quote an enabled settlement rail using available withdrawable proceeds.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteCreate' } } } }
      responses:
        '201': { description: Short-lived settlement quote, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/pay/settlements:
    get:
      operationId: listPaySettlements
      tags: [Settlements]
      description: List or export the current merchant's settlement requests.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Query' }
        - { name: status, in: query, schema: { type: string, enum: [REQUESTED, APPROVED, PAID, REJECTED] } }
        - { $ref: '#/components/parameters/Format' }
      responses:
        '200': { description: Paginated settlements or CSV export, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementListResponse' } }, text/csv: { schema: { type: string } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: requestPaySettlement
      tags: [Settlements]
      description: Reserve proceeds for a quoted settlement or replay a matching request.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementCreate' } } } }
      responses:
        '201': { description: Settlement requested or replayed, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/payment/mobocom-pay/bank-events:
    post:
      operationId: acceptPayBankEvent
      tags: [Bank bridge]
      security: []
      description: >-
        Signed bank bridge, not the merchant API. Sign the exact raw JSON bytes with HMAC-SHA256 over
        timestamp + '.' + body. The timestamp is Unix seconds within 300 seconds; the lowercase hex
        signature uses the configured secret. Maximum body size is 8000 bytes. targetPaymentId must
        be bank-attested for automatic credit; an unbound event is stored unmatched and cannot credit.
        A provider adapter must derive attribution from authoritative bank data; none is provided yet.
      parameters:
        - { name: x-pay-timestamp, in: header, required: true, schema: { type: string, pattern: '^\d{10}$' } }
        - { name: x-pay-signature, in: header, required: true, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BankEvent' } } } }
      responses:
        '200': { description: Accepted or replayed event, content: { application/json: { schema: { $ref: '#/components/schemas/BankEventResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, description: Reuse the same key and payload for retries; a different payload conflicts., schema: { type: string, minLength: 16, maxLength: 100, pattern: '^[A-Za-z0-9_-]+$' } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000 } }
    Query: { name: q, in: query, schema: { type: string, maxLength: 100 } }
    Format: { name: format, in: query, description: csv exports at most 1000 entries., schema: { type: string, enum: [csv] } }
  responses:
    Error:
      description: Invalid request, authentication or access denied, conflict, rate limit, or unavailable service (400, 401, 403, 404, 405, 409, 413, 422, 429, 503).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    UsdtEquivalent:
      type: object
      description: Informational equivalent of the full requested Rial amount. Approved persisted USDT rate only; no USD peg fallback or provider call on checkout. Four decimal rounding; lessThan marks a sub-0.0001 amount. Provider rates older than 24 hours are stale; explicit manual or locked rates are labeled with their original timestamp.
      required: [asset, network, standard, displayOnly, status, amount, lessThan, rateToman, asOf, manual]
      properties:
        asset: { type: string, enum: [USDT] }
        network: { type: string, enum: [BSC] }
        standard: { type: string, enum: [BEP20] }
        displayOnly: { type: boolean, enum: [true] }
        status: { type: string, enum: [AVAILABLE, STALE, UNAVAILABLE] }
        amount: { type: string, nullable: true, pattern: '^[0-9]+\.[0-9]{4}$' }
        lessThan: { type: boolean }
        rateToman: { type: string, nullable: true }
        asOf: { type: string, format: date-time, nullable: true }
        manual: { type: boolean }
    BotPaymentCreate:
      type: object
      additionalProperties: false
      required: [api_key, amount, order_id, user_id, type]
      properties:
        api_key: { type: string, writeOnly: true, pattern: '^mcpbot_[A-Za-z0-9_-]{43}$' }
        amount: { type: integer, minimum: 1, maximum: 900000000000000, description: Exact Toman; existing configured payment limits also apply. }
        order_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$' }
        user_id: { type: integer, minimum: 1, maximum: 9007199254740991, description: Bot customer claim; never a canonical MoboCom UserId. }
        type: { type: string, enum: [purchase, renewal, balance_increase] }
        username: { type: string, pattern: '^[A-Za-z0-9_]{0,64}$' }
        first_name: { type: string, maxLength: 160 }
        payment_count: { type: integer, minimum: 0, maximum: 9007199254740991, description: Merchant claim used only for optional routing; missing cannot meet a positive threshold. }
        register: { type: integer, minimum: 0, maximum: 9007199254740991 }
        membership_days: { type: integer, minimum: -1, maximum: 9007199254740991, description: Merchant claim used only for optional routing; missing or -1 cannot meet a positive threshold. }
        balance: { type: integer, minimum: 0, maximum: 9007199254740991, description: Merchant claim in Toman; not MoboCom Wallet funds. }
    CheckoutResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, enum: [true] }
        data:
          type: object
          required: [id, amountRial, totalRial, feeRial, feeBearer, status, verification, gateways, bank, receipt]
          properties:
            id: { type: string }
            amountRial: { $ref: '#/components/schemas/Rial' }
