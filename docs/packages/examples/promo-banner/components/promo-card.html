<article class="promo-card" dir="rtl">
  <img src="assets/spark.svg" alt="" width="36" height="36">
  <h3>{{field.title}}</h3>
  <p>{{field.text}}</p>
  {{#field.code}}<p class="promo-code">کد: <code>{{field.code}}</code></p>{{/field.code}}
  {{#field.link}}<a href="{{field.link}}">{{field.label}}</a>{{/field.link}}
</article>
